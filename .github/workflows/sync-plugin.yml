name: Sync plugin from the ecosystem

# One-click publish: copies plugins/oak-open-curriculum from
# oak-open-curriculum-ecosystem at the given ref, strips the excluded paths,
# rewrites PROVENANCE.json, stubs the root CHANGELOG entry and opens a pull
# request — so a publish cannot be done inconsistently by hand. The fidelity
# check runs here too, and again as a required check on the pull request.
#
# NOTE: pull requests created with the default GITHUB_TOKEN do not trigger
# other workflows, so the PR opens with no checks. Close and reopen it (or
# push an empty commit) to start them.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ecosystem ref to copy (tag, branch or SHA)'
        required: true
        default: 'main'
      release:
        description: 'Ecosystem release the ref belongs to (e.g. v1.185.3); recorded in PROVENANCE.json'
        required: false

permissions:
  contents: read

jobs:
  sync:
    name: Copy the plugin and open a pull request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the sync branch
      pull-requests: write # open the pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out the ecosystem at the requested ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: oaknational/oak-open-curriculum-ecosystem
          ref: ${{ inputs.ref }}
          path: ecosystem
          persist-credentials: false

      - name: Copy the plugin and update PROVENANCE.json + CHANGELOG.md
        run: |
          COMMIT=$(git -C ecosystem rev-parse HEAD)
          python3 scripts/sync_plugin.py --source ecosystem --commit "$COMMIT" \
            ${RELEASE:+--release "$RELEASE"}
          rm -rf ecosystem
          echo "COMMIT=$COMMIT" >> "$GITHUB_ENV"
        env:
          RELEASE: ${{ inputs.release }}

      - name: Check the copy against its recorded source
        run: |
          python3 scripts/check_provenance.py
          python3 scripts/check_against_plugin.py

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('claude/plugin/oak-open-curriculum/.claude-plugin/plugin.json'))['version'])")
          BRANCH="sync/plugin-${VERSION}-${COMMIT:0:9}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git diff --cached --quiet && { echo "Nothing changed; the copy already matches ${COMMIT:0:9}."; exit 0; }
          git commit -m "chore: publish the Claude plugin ${VERSION} from the ecosystem at ${COMMIT:0:9}"
          git push origin "$BRANCH"
          gh pr create \
            --title "chore: publish the Claude plugin ${VERSION} from the ecosystem at ${COMMIT:0:9}" \
            --body "$(printf 'Copies `plugins/oak-open-curriculum` from oak-open-curriculum-ecosystem at %s%s, without the excluded paths in PROVENANCE.json. Produced by the **Sync plugin from the ecosystem** workflow; the Sync fidelity check proves the copy.\n\nChecks do not start on workflow-created pull requests: close and reopen this PR to run them.' "$COMMIT" "${RELEASE:+ (release $RELEASE)}")"
